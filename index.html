<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Praia — deslize e ache seu imóvel no litoral</title>
<meta name="description" content="Matcher estilo swipe para imóveis no litoral paulista. Satélite da rede praia.digital">
<style>
:root{--sea:#0077b6;--sand:#ffd166;--dark:#023047;--foam:#caf0f8}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{background:linear-gradient(160deg,#023047,#0077b6);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center}
header{padding:16px;text-align:center}
nav a{color:#ffd166;margin:0 8px;text-decoration:none;font-size:14px}
.card{background:#fff;color:#023047;width:min(360px,90vw);border-radius:20px;padding:24px;margin:24px auto;box-shadow:0 20px 40px rgba(0,0,0,.35);transition:transform .3s,opacity .3s}
.card h2{font-size:22px}.price{color:#0077b6;font-size:26px;font-weight:800;margin:8px 0}
.tag{display:inline-block;background:#caf0f8;border-radius:99px;padding:4px 12px;margin:3px;font-size:12px}
.emoji{font-size:64px;text-align:center;display:block;margin-bottom:8px}
.btns{display:flex;gap:16px;justify-content:center;margin:16px 0 40px}
.btns button{font-size:30px;width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.nope{background:#ff5d8f}.like{background:#06d6a0}
.score{margin-top:12px;font-size:14px;color:#555}
footer{margin-top:auto;padding:16px;font-size:13px;text-align:center;color:#caf0f8}
footer a{color:#ffd166}
</style></head>
<body>
<header><h1>🏖️ Match Praia</h1><p>Dê match com o imóvel dos seus sonhos no litoral</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/radar-precos">Radar de Preços</a><a href="https://praia.digital/plano-litoral">Plano Litoral</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="card" id="card"></div>
<div class="btns"><button class="nope" onclick="vote(false)">✖</button><button class="like" onclick="vote(true)">❤</button></div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/marea">Maréa</a> · <a href="https://praia.digital/concierge-ia">Concierge IA</a> · <a href="https://praia.digital/tour-360">Tour 360</a></footer>
<script>
const imoveis=[
{n:'Apê frente-mar Gonzaga',c:'Santos',p:890000,m:72,t:['vista mar','2 vagas','varanda'],e:'🌊'},
{n:'Casa com piscina Riviera',c:'São Sebastião',p:1450000,m:180,t:['piscina','4 suítes','condomínio'],e:'🏡'},
{n:'Studio pé na areia',c:'Guarujá',p:420000,m:38,t:['mobiliado','temporada','1 vaga'],e:'🏄'},
{n:'Cobertura Boqueirão',c:'Santos',p:1650000,m:140,t:['terraço','3 suítes','vista mar'],e:'🌅'},
{n:'Apê Maresias surf vibe',c:'São Sebastião',p:680000,m:64,t:['perto da praia','2 quartos'],e:'🏝️'},
{n:'Kitnet investidor',c:'Praia Grande',p:210000,m:28,t:['alto ROI','mobiliada'],e:'💰'},
{n:'Casa de vila Caraguá',c:'Caraguatatuba',p:520000,m:110,t:['quintal','3 quartos'],e:'🌺'},
{n:'Loft moderno Astúrias',c:'Guarujá',p:750000,m:85,t:['design','vista parcial'],e:'🌆'}];
let i=0,likes=0;
function render(){const x=imoveis[i%imoveis.length];
document.getElementById('card').innerHTML=`<span class="emoji">${x.e}</span><h2>${x.n}</h2><p>📍 ${x.c}</p><div class="price">R$ ${x.p.toLocaleString('pt-BR')}</div><p>${x.m} m² · R$ ${Math.round(x.p/x.m).toLocaleString('pt-BR')}/m²</p><div>${x.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div><p class="score">❤ ${likes} matches até agora</p>`;}
function vote(l){const c=document.getElementById('card');c.style.transform=l?'translateX(300px) rotate(15deg)':'translateX(-300px) rotate(-15deg)';c.style.opacity=0;if(l)likes++;i++;setTimeout(()=>{c.style.transition='none';c.style.transform='none';c.style.opacity=1;c.style.transition='transform .3s,opacity .3s';render();},300);}
render();
</script></body></html>
