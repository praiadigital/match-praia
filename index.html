<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Match Praia — encontre seu imóvel ideal no swipe | Praia Digital</title><meta name="description" content="Estilo Tinder: responda 6 perguntas e descubra qual cidade do litoral combina com seu perfil."><link rel="canonical" href="https://praia.digital/match-praia/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:640px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 6px 20px #0002;text-align:center}button{display:block;width:100%;margin:10px 0;padding:16px;border:2px solid #0ea5e9;background:#fff;color:#0c4a6e;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}button:hover{background:#0ea5e9;color:#fff}.res{font-size:1.4rem}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}.prog{color:#94a3b8;font-size:.85rem}</style></head><body><header class="hero"><h1>💘 Match Praia</h1><p>6 perguntas. 1 cidade perfeita para você no litoral paulista.</p></header><main class="container"><div class="card" id="quiz"></div><div class="card"><strong>Encontrou sua cidade?</strong><br>🏠 <a class="app" href="https://praia.digital/avaliador-imoveis/">Avaliador de Imóveis</a> — veja o valor por m² lá<br>🏖️ <a class="app" href="https://praia.digital/bairro-score/">Bairro Score</a> — compare bairros da cidade<br>🗺️ <a class="app" href="https://praia.digital/mapa-inteligente/">Mapa Inteligente</a> — explore no mapa</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>var perg=[['O que você mais valoriza?',['Praia paradisíaca',0],['Vida urbana e serviços',1],['Custo-benefício',2]],['Seu orçamento por m²?',['Até R$ 6 mil',2],['R$ 6–10 mil',1],['Acima de R$ 10 mil',0]],['Uso principal?',['Temporada/fins de semana',0],['Moradia permanente',1],['Investimento',2]],['Agito ou sossego?',['Sossego total',0],['Equilíbrio',1],['Agito e nightlife',2]],['Distância de SP importa?',['Quanto mais perto melhor',1],['Até 2h30',2],['Não importa',0]],['Surf ou mar calmo?',['Surf e ondas',0],['Mar calmo para família',1],['Tanto faz',2]]];var cidades=[['Maresias / São Sebastião','Praias de surf, natureza e badalação. O point clássico do litoral norte.',0],['Ilhabela','Ilha paradisíaca, sossego e natureza preservada.',0],['Santos','Cidade completa: serviços, mobilidade e praia urbana.',1],['Guarujá','Perto de SP, praias lindas e estrutura completa.',1],['Caraguatatuba','Melhor custo do litoral norte, mar calmo, família.',2],['Praia Grande','Preço acessível, perto de SP e mercado aquecido.',2]];var i=0,score=[0,0,0];function render(){var q=document.getElementById('quiz');if(i<perg.length){var p=perg[i];q.innerHTML='<p class="prog">Pergunta '+(i+1)+' de '+perg.length+'</p><h2>'+p[0]+'</h2>'+p.slice(1).map(function(o){return '<button onclick="pick('+o[1]+')">'+o[0]+'</button>'}).join('');}else{var best=score.indexOf(Math.max.apply(null,score));var cand=cidades.filter(function(c){return c[2]===best});var c=cand[Math.floor(Math.random()*cand.length)];q.innerHTML='<p class="res">🎉 Seu match: <strong>'+c[0]+'</strong></p><p>'+c[1]+'</p><p><a class="app" href="https://praia.digital/radar-precos/">Ver preços na cidade →</a></p><button onclick="i=0;score=[0,0,0];render()">Refazer quiz</button>';}}function pick(v){score[v]++;i++;render();}render();</script></body></html>
